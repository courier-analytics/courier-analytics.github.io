<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="description" content="Операционные показатели курьеров ДС 7745 по датам с 15.10 по 17.10.2026">
  <title>ДС 7745 — Операционные метрики кураторов</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232b62cf'/%3E%3Cpath d='M14 42h36M18 28h28M25 17h14' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:light;--bg:#f6f8fc;--paper:#fff;--ink:#17253b;--muted:#69788d;--line:#e4eaf2;--blue:#285dcc;--blue-soft:#edf3ff;--radius:18px}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    .shell{max-width:1640px;margin:0 auto;padding:35px 24px 52px}
    .eyebrow{display:flex;align-items:center;gap:10px;color:var(--blue);font-size:12px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
    .eyebrow .mark{width:10px;height:10px;border-radius:3px;background:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
    header{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin:14px 0 26px}
    h1{font-size:clamp(24px,3vw,36px);letter-spacing:-.045em;line-height:1.18;margin:0 0 9px;font-weight:780}
    .description{color:var(--muted);margin:0;font-size:14px}
    .actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:9px}
    button{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;cursor:pointer;border:1px solid #dce4ee;border-radius:10px;background:white;color:#34465e;padding:10px 13px;font:600 13px/1.2 inherit;transition:background .16s,border-color .16s}
    button:hover{background:#f4f7fd;border-color:#bdcce3}
    button:focus-visible{outline:3px solid #9cbbf8;outline-offset:2px}
    button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .primary{background:var(--blue);border-color:var(--blue);color:#fff}
    .primary:hover{background:#204fab;border-color:#204fab}
    .panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 35px rgba(24,49,88,.035);overflow:hidden}
    .panel-heading{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:19px 23px 17px;border-bottom:1px solid var(--line)}
    h2{font-size:16px;letter-spacing:-.015em;margin:0;font-weight:750}
    .panel-note{color:var(--muted);font-size:12px;white-space:nowrap}
    .tool-transition-note{display:flex;align-items:center;gap:9px;margin:0;padding:10px 23px;background:#f5f3ff;border-bottom:1px solid #ede9fe;color:#5b21b6;font-size:12px;line-height:1.4}
    .tool-transition-note::before{content:"";flex:none;width:4px;height:22px;background:#8b5cf6;border-radius:2px}
    #metricsTable .tool-transition{border-left:4px solid #8b5cf6}
    .table-scroll{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-color:#cbd6e7 transparent}
    table{width:100%;min-width:1140px;border-collapse:separate;border-spacing:0;table-layout:fixed;font-variant-numeric:tabular-nums}
    col.metric-col{width:315px}
    col.day-col{width:91px}
    col.goal-col{width:96px}
    thead th{background:#f8fafd;color:#65758b;font-size:12px;font-weight:720;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line);padding:15px 7px}
    thead th:first-child{text-align:left;padding-left:23px}
    thead th:last-child{background:#f8fafd;color:#65758b}
    tbody td,tbody th{border-bottom:1px solid #edf0f5;padding:12px 7px;text-align:center;background:white;height:63px}
    tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
    tbody th{font-size:13px;font-weight:630;text-align:left;padding-left:23px;padding-right:15px;line-height:1.32}
    tbody tr:hover td,tbody tr:hover th{background:#fafcff}
    thead th:first-child,tbody th{position:sticky;left:0;z-index:2;box-shadow:1px 0 0 #e8edf5}
    thead th:first-child{z-index:4}
    .metric-title{display:flex;align-items:center;gap:11px}
    .metric-index{flex:none;width:24px;height:24px;display:grid;place-items:center;border-radius:7px;background:#f0f3f8;color:#8190a4;font-size:11px;font-weight:700}
    .cell{display:inline-flex;min-width:64px;min-height:33px;align-items:center;justify-content:center;border-radius:8px;font-size:12px;font-weight:700;padding:6px 5px}
    .cell.good{background:#e5f6ed;color:#14744a}
    .cell.mid{background:#fff4db;color:#986212}
    .cell.bad{background:#ffebec;color:#b63c4b}
    .cell.empty{color:#b4becc;font-weight:500}
    .goal{color:var(--ink);font-weight:750;font-size:13px;background:white}
    .date-latest{background:#f8fafd}
    .footnotes{padding:16px 23px 18px;border-top:1px solid var(--line);background:#fcfdff;color:#78869a;font-size:12px}
    .footnotes p{margin:0}
    .footnotes p+p{margin-top:5px}
    .footer{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;color:#8a97a8;font-size:12px;padding:17px 4px}
    .toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);padding:11px 17px;border-radius:10px;background:#172b4b;color:#fff;box-shadow:0 10px 25px #172b4b33;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10}
    .toast.visible{opacity:1;transform:translate(-50%,0)}
    @media(max-width:820px){.shell{padding:22px 12px 32px}header{display:block;margin:15px 4px 20px}h1{font-size:26px}.actions{justify-content:flex-start;margin-top:18px}.panel-heading{padding:15px 16px}.panel-note{white-space:normal;text-align:right}.footnotes{padding:15px 16px}col.metric-col{width:235px}tbody th{padding-left:12px;font-size:12px}.metric-title{gap:7px}.metric-index{width:20px;height:20px}thead th:first-child{padding-left:12px}.footer{padding:14px 4px}}
    @media print{@page{size:A3 landscape;margin:12mm}body{background:white;font-size:11px}.shell{max-width:none;padding:0}.actions,.footer,.toast{display:none!important}header{margin:0 0 14px}h1{font-size:24px}.panel{border:1px solid #ccd3df;box-shadow:none}.panel-heading{padding:10px 12px}.table-scroll{overflow:visible}table{min-width:0;width:100%}col.metric-col{width:250px}col.day-col{width:auto}col.goal-col{width:70px}thead th{padding:9px 3px}tbody td,tbody th{padding:6px 2px;height:42px}tbody th{padding-left:8px;font-size:10px}.cell{min-width:0;width:100%;font-size:10px;padding:5px 1px}.metric-index{display:none}.footnotes{padding:10px 12px}thead th:first-child,tbody th{position:static;box-shadow:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
    .store-picker{display:flex;align-items:center;gap:12px;margin-bottom:22px;font-weight:700;color:var(--ink)}
    .store-picker select{appearance:auto;min-width:180px;padding:11px 14px;border:1px solid #cbd6e7;border-radius:10px;background:#fff;color:#17253b;font:700 14px inherit;cursor:pointer}
    .store-picker select:focus-visible{outline:3px solid #9cbbf8;outline-offset:2px}
    @media print{.store-picker{display:none}}
    .data-status{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 18px;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
    .data-status p{margin:0;color:var(--muted);font-size:13px}
    @media(max-width:820px){.data-status{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<main class="shell">
  <nav aria-label="Выбор даркстора" class="store-picker"><label for="storeSelect">Даркстор</label><select id="storeSelect" aria-label="Выбрать даркстор"><option value="5818">ДС 5818</option><option value="7745" selected>ДС 7745</option></select></nav>
  <div class="eyebrow"><span class="mark" aria-hidden="true"></span> Курьерская служба · ДС 7745</div>
  <header>
    <div>
      <h1>Операционные метрики кураторов — ДС 7745</h1>
      <p class="description">Ежедневные показатели работы кураторов · 15–20 октября 2026 года</p>
    </div>
    <div class="actions">
      <button id="copyLink" type="button" aria-label="Скопировать ссылку на таблицу">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>Скопировать ссылку
      </button>
      <button id="printReport" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6zM18 12h.01"/></svg>Печать
      </button>
      <button class="primary" id="downloadCsv" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></svg>Скачать CSV
      </button>
    </div>
  </header>
  <section class="data-status" aria-label="Источник данных">
    <p id="dataStatus" role="status" aria-live="polite">Загружаем последнюю выгрузку…</p>
    <button id="refreshData" type="button">Обновить данные</button>
  </section>
  <section class="panel" aria-labelledby="tableTitle">
    <div class="panel-heading"><h2 id="tableTitle">Таблица показателей</h2><span class="panel-note">10 метрик · 5 дней · Цель</span></div>
    <p class="tool-transition-note" id="toolTransitionNote">25 октября · Переход на инструмент «Выходы курьеров»</p>
    <div class="table-scroll" tabindex="0" aria-label="Таблица показателей, прокручивается горизонтально">
      <table id="metricsTable">
        <colgroup><col class="metric-col"><col class="day-col" span="5"><col class="goal-col"></colgroup>
        <thead><tr id="headerRow"><th scope="col">Показатель</th></tr></thead>
        <tbody id="metricsBody"></tbody>
      </table>
    </div></section></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const dates = ["18.10","19.10","20.10","21.10","22.10","23.10","24.10","25.10","26.10","27.10","28.10","29.10","30.10"];
// Значения хранятся строками; отображение всех процентов единообразно: две цифры после запятой.
// null означает, что показатель за дату не предоставлен.
const metrics = [
  {name:"Знание прогноза на завтра",goal:"100",better:"high",values:["0","0","0","0","0","0","0","50","50","50","50","50","50"]},
  {name:"Процент курьеров проставивших смену в МП",goal:"100",better:"high",values:["0","0","0","0","0",null,null,null,null,null,null,null,null]},
  {name:"Заполнение слотов относительно ориентира",goal:"100",better:"high",values:[null,null,null,null,null,null,null,null,null,null,null,null,null]},
  {name:"Курьеры, вышедшие по плану",goal:"100",better:"high",values:["78,26","86,36","82,61","87,10","77,42",null,null,null,null,null,null,null,null]},
  {name:"Опоздавшие среди вышедших по плану",goal:"0",better:"low",values:["72,22","57,89","42,11","70,37","62,50",null,null,null,null,null,null,null,null]},
  {name:"Курьеры, работавшие вне плана",goal:"0",better:"low",values:["50,00","50,00","44,12","22,86","16,67",null,null,null,null,null,null,null,null]},
  {name:"Курьеры, доработавшие плановую смену до конца",goal:"100",better:"high",values:["66,67","73,68","73,68","70,37","62,50",null,null,null,null,null,null,null,null]},
  {name:"Работа с обращениями",goal:"100",better:"high",values:["0","14,29","0","0","0","0","33,33","36,36","36,36","20","0","36,36",null]},
  {name:"Обучение курьеров",goal:"100",better:"high",values:[null,null,null,null,null,"26,67","26,67","26,67","33,33","33,33","30,56","47,22","69,44"]},
  {name:"Медицинские книжки",goal:"100",better:"high",values:["36,5","36,5","36,5","39,2","39,1","42,0","57,2","63,2","63,4","65,1","76,7","80,9","81,8"]}
];
function formatPercent(value) {
  const number=Number(String(value).replace(",", "."));
  return number.toFixed(2).replace(".", ",")+"%";
}
function textCell(tag,content,className) {
  const el=document.createElement(tag);
  el.textContent=content;
  if(className) el.className=className;
  return el;
}
// Пороговые значения для метрик в порядке отображения. На границе выбирается лучший цвет.
function statusClass(value,index) {
  const num=Number(String(value).replace(",","."));
  if(index===0) return num>=100?"good":num>=50?"mid":"bad";
  if(index===1) return num>=90?"good":num>=70?"mid":"bad";
  if(index===2) return num>=85?"good":num>=70?"mid":"bad";
  if(index===3) return num>=90?"good":num>=80?"mid":"bad";
  if(index===4||index===5) return num<=10?"good":num<=20?"mid":"bad";
  if(index===6) return num>=90?"good":num>=80?"mid":"bad";
  if(index===7) return num>=90?"good":num>=70?"mid":"bad";
  if(index===8||index===9) return num>=80?"good":num>=60?"mid":"bad";
  return "";
}
const approvedManualMedicalDates = new Set(["23.10","24.10","25.10","26.10"]);
function render() {
  const head=document.getElementById("headerRow");
  while(head.children.length>1) head.lastElementChild.remove();
  dates.forEach(function(date,i){
    const th=textCell("th",date,i===dates.length-1?"date-latest":"");
    if(date==="25.10" && dates[i-1]==="24.10"){
      th.classList.add("tool-transition");
      th.title="Переход на инструмент «Выходы курьеров» с 25 октября";
      th.setAttribute("aria-describedby","toolTransitionNote");
    }
    th.scope="col";
    head.appendChild(th);
  });
  const goalHead=textCell("th","Цель");
  goalHead.scope="col";
  head.appendChild(goalHead);
  const body=document.getElementById("metricsBody");
  body.replaceChildren();
  metrics.forEach(function(metric,index){
    const tr=document.createElement("tr");
    const th=document.createElement("th");
    th.scope="row";
    const wrap=document.createElement("span");
    wrap.className="metric-title";
    wrap.appendChild(textCell("span",String(index+1),"metric-index"));
    wrap.appendChild(textCell("span",metric.name));
    th.appendChild(wrap);
    tr.appendChild(th);
    metric.values.forEach(function(value,dayIndex){
      const td=document.createElement("td");
      if(dates[dayIndex]==="25.10" && dates[dayIndex-1]==="24.10") td.classList.add("tool-transition");
      const span=textCell("span",value===null?"—":formatPercent(value),value===null?"cell empty":"cell "+statusClass(value,index));
      if(index===9 && approvedManualMedicalDates.has(dates[dayIndex]) && value!==null){
        td.title="Значение утверждено пользователем вручную.";
        td.dataset.source="manual";
      }
      td.appendChild(span);
      tr.appendChild(td);
    });
    tr.appendChild(textCell("td",formatPercent(metric.goal),"goal"));
    body.appendChild(tr);
  });
}
function csvQuote(value) {
  return '"'+String(value).replace(/"/g,'""')+'"';
}
function downloadCsv() {
  const rows=[["Показатель"].concat(dates).concat(["Цель"])];
  metrics.forEach(function(m){rows.push([m.name].concat(m.values.map(function(v){return v===null?"":formatPercent(v);})).concat([formatPercent(m.goal)]));});
  const csv="\ufeff"+rows.map(function(row){return row.map(csvQuote).join(";");}).join("\r\n");
  const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
  const link=document.createElement("a");
  link.href=url;
  link.download="ds-7745-courier-metrics-2026-"+dates[dates.length-1].slice(3)+"-"+dates[dates.length-1].slice(0,2)+".csv";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
let toastTimer;
function notify(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("visible");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove("visible");},2500);
}
async function copyLink(){
  try{
    if(navigator.clipboard&&window.isSecureContext){
      await navigator.clipboard.writeText(location.href);
    }else{
      const input=document.createElement("textarea");
      input.value=location.href;
      input.style.position="fixed";
      input.style.opacity="0";
      document.body.appendChild(input);
      input.select();
      const ok=document.execCommand("copy");
      input.remove();
      if(!ok) throw new Error("Copy unavailable");
    }
    notify("Ссылка скопирована");
  }catch(e){notify("Скопируйте адрес из строки браузера");}
}
document.getElementById("storeSelect").addEventListener("change",function(e){window.location.href=({"5818":"index.html","7745":"7745.html"})[e.target.value]||"index.html";});
render();
document.getElementById("downloadCsv").addEventListener("click",downloadCsv);
document.getElementById("copyLink").addEventListener("click",copyLink);
document.getElementById("printReport").addEventListener("click",function(){window.print();});
</script>
<script src="dashboard-data.js"></script>
</body>
</html>
